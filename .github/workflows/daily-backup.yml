name: OHT Daily Backup

on:
  schedule:
    # Roz raat 2:00 AM Pakistan time (PKT = UTC+5) par chalta hai
    - cron: '0 21 * * *'
  workflow_dispatch:   # ye line "Run workflow" button deti hai — turant test karne ke liye

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Repo checkout
        uses: actions/checkout@v4

      - name: Node.js setup
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Dependencies install
        run: npm install
        working-directory: backup-job

      - name: Backup chalao
        run: npm start
        working-directory: backup-job
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          BACKUP_TO_EMAIL: ${{ secrets.BACKUP_TO_EMAIL }}
